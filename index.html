<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Givora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#feee00">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Givora">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--m:#3866df;--y:#feee00;--bg:#f3f3f6;--tx:#1a1a1a;--g:#6b6b76;--c:#fff;--sf:#f3f3f6;--bd:#e2e2e8}
@media (prefers-color-scheme:dark){:root{--m:#7b9bff;--bg:#121214;--tx:#f2f2f4;--g:#a3a3ad;--c:#1e1e22;--sf:#2a2a30;--bd:#33333a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;max-width:560px;margin:0 auto;padding-bottom:40px}
header{background:var(--y);color:#111;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:sticky;top:0;z-index:5}
header b{font-weight:800;letter-spacing:-.02em}
header button{background:none;border:0;color:#111;font-size:15px;font-weight:700;margin-left:8px;cursor:pointer;padding:6px 4px}
.lang{background:#111!important;color:var(--y)!important;border-radius:12px;padding:4px 10px!important}
input,textarea,select{width:100%;padding:12px;margin-top:10px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--m);outline-offset:0}
.sbar{background:var(--y);padding:2px 12px 14px}
.sbar input{margin-top:0;border:0;border-radius:10px;background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ban{margin:12px;border-radius:12px;background:#111;color:var(--y);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;border:1px solid var(--bd)}
.ban span{color:#fff;font-weight:500;font-size:13px;text-align:right}
.cats{display:flex;gap:10px;overflow-x:auto;padding:6px 12px 4px}
.cat{flex:none;width:74px;background:none;border:0;color:var(--tx);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.cat *{pointer-events:none}
.cat .ci{width:58px;height:58px;border-radius:50%;background:var(--c);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:27px}
.cat.on .ci{background:var(--y);border-color:#111}
.cat.on{font-weight:700}
.cat span:last-child{line-height:1.2;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--c);color:var(--tx);font-weight:600;cursor:pointer}
.chip.on{background:var(--y);color:#111;border-color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.card,.row{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.card .cb{padding:10px 10px 12px;display:flex;flex-direction:column;flex:1}
.em{background:var(--sf);display:flex;align-items:center;justify-content:center;min-height:130px;font-size:56px}
.em img{border-radius:0!important}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.row>div{flex:1}
.pn{font-weight:500;font-size:13px;margin:0 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{color:var(--tx);font-weight:800;font-size:17px}
.cod{align-self:flex-start;margin-top:6px;font-size:11px;font-weight:700;background:var(--y);color:#111;border-radius:4px;padding:1px 6px}
.btn{background:var(--m);color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer;width:100%;margin-top:auto;font-size:14px}
.card .btn{margin-top:10px}
.pad .btn,.pad>.btn{margin-top:8px}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.pad{padding:12px 16px}.note{color:var(--g);font-size:13px}h2{margin:12px 0 4px;font-size:18px}
.q button{width:30px;height:30px;border-radius:15px;border:0;background:var(--sf);color:var(--tx);font-size:18px;cursor:pointer}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--y);color:#111;font-weight:600}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.frow{display:flex;gap:8px;padding:0 12px}.frow>*{margin-top:0;min-width:0;flex:1}
</style>
</head>

 <div class="sbar"><input id="q" placeholder="${x.search}" value="${esc(S.q)}"></div><div class="ban"><b>${x.cod}</b><span>${x.dl}: ${ZONES.map(z=>(S.lang==="bn"?z.bn:z.en)+" "+tk(z.charge)).join(" · ")}</span></div>
 <div class="cats">${Object.entries(x.cats).map(([k,v])=>{const i=v.indexOf(" ");return`<button class="cat ${S.cat===k?"on":""}" data-cat="${k}"><span class="ci">${v.slice(0,i)}</span><span>${esc(v.slice(i+1))}</span></button>`}).join("")}</div>
 <div class="frow"><input id="pmin" inputmode="numeric" placeholder="${x.pmin}" value="${esc(S.pmin)}"><input id="pmax" inputmode="numeric" placeholder="${x.pmax}" value="${esc(S.pmax)}"><select id="sort">${Object.entries(x.sort).map(([k,v])=>`<option value="${k}" ${S.sort===k?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="note" style="padding:8px 14px 0">${ps.length} ${x.cnt}${(S.cat!=="all"||S.q||S.pmin||S.pmax||S.sort!=="def")?` <button class="chip" data-clr="1">${x.clr}</button>`:""}</div>
 <div class="grid">${ps.map(p=>`<div class="card"><div class="em">${picBig(p)}</div><div class="cb"><div class="pn">${esc(nm(p))}</div><div class="pr">${tk(p.price)}</div><span class="cod">${x.half}</span><button class="btn" data-add="${p.id}">+ ${x.add}</button></div></div>`).join("")||`<p class="note pad">${x.none}</p>`}</div>`;
 $("#q").oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 for(const k of["pmin","pmax"])$("#"+k).oninput=e=>{S[k]=e.target.value.replace(/\D/g,"");render();const n=$("#"+k);n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 $("#sort").onchange=e=>{S.sort=e.target.value;render()};
}else if(S.tab==="cart"){
 const its=S.prods.filter(p=>S.cart[p.id]),sub=its.reduce((s,p)=>s+p.price*S.cart[p.id],0),z=zone(),ship=z.charge,tot=sub+ship,adv=Math.ceil(tot/2);
 a.innerHTML=`<div class="pad"><button class="btn s" data-go="home">← ${x.home}</button>`+(its.length?its.map(p=>`<div class="row">${pic(p,46)}<div><div class="pn">${esc(nm(p))}</div><div class="pr">${tk(p.price*S.cart[p.id])}</div></div><div class="q"><button data-q="${p.id}" data-d="-1">−</button> ${S.cart[p.id]} <button data-q="${p.id}" data-d="1">+</button></div></div>`).join("")+
 `<label class="note">${x.area}</label><select id="fz" style="margin-top:4px">${ZONES.map(q=>`<option value="${q.k}" ${S.zone===q.k?"selected":""}>${S.lang==="bn"?q.bn:q.en} — ${tk(q.charge)}</option>`).join("")}</select><p class="note">${x.dl}: ${tk(ship)}</p><h2>${x.total}: ${tk(tot)}</h2><div class="box"><div>${x.adv}: <b>${tk(adv)}</b></div><div>${x.due}: <b>${tk(tot-adv)}</b></div><p class="note" style="margin:8px 0 0">${x.payhow.replace("{n}","<b>"+BKASH_NUMBER+"</b>")}</p></div><input id="fn" placeholder="${x.name}" value="${esc(S.f.n)}"><input id="fp" placeholder="${x.phone}" inputmode="tel" maxlength="14" value="${esc(S.f.p)}"><textarea id="fa" rows="3" placeholder="${x.addr}">${esc(S.f.a)}</textarea><input id="fb" placeholder="${x.bks}" inputmode="tel" maxlength="11" value="${esc(S.f.b)}"><input id="ft" placeholder="${x.trx}" maxlength="12" autocapitalize="characters" value="${esc(S.f.t)}"><button class="btn" id="po">${x.order}</button>`:`<p class="note">${x.empty}</p>`)+`</div>`;
}else if(S.tab==="login"){
 a.innerHTML=`<div class="pad"><button class="btn s" data-go="home">← ${x.home}</button><h2>${x.login}</h2><p class="note">${x.lnote}</p><input id="le" type="email" placeholder="${x.email}"><input id="lp" type="password" placeholder="${x.pass}"><button class="btn" id="li">${x.login}</button><button class="btn s" id="su">${x.signup}</button></div>`;
}else if(S.tab==="my"){
 a.innerHTML=`<div class="pad"><button class="btn s" data-go="home">← ${x.home}</button><h2>${x.myorders}</h2>`+(S.my.map(o=>`<div class="row" style="display:block;margin-top:8px"><span class="tag">${x.st[o.status]||o.status}</span> <span class="note">${new Date(o.created_at).toLocaleDateString()}</span><div class="note">${(o.items||[]).map(i=>esc(i.name)+" ×"+Number(i.qty)).join(", ")}</div><div class="pr">${tk(o.total)}</div>${payInfo(o)}</div>`).join("")||`<p class="note">${x.none}</p>`)+`<button class="btn s" id="lo">${x.logout}</button></div>`;
}else{
 const tabs=["orders",...(can("pm")?["prods"]:[]),...(can("owner")?["team"]:[])];
 const fo=S.orders.filter(o=>(S.ost==="all"||o.status===S.ost)&&((o.name||"")+" "+(o.phone||"")).toLowerCase().includes(S.oq.toLowerCase()));
 a.innerHTML=`<div class="pad"><button class="btn s" data-go="home">← ${x.home}</button></div><div class="chips">${tabs.map(k=>`<button class="chip ${S.atab===k?"on":""}" data-at="${k}">${x[k]}</button>`).join("")}<button class="chip" id="lo">${x.logout}</button></div>`+
 (S.atab==="orders"?`<div class="pad"><button class="btn s" id="rf">${x.refresh}</button><input id="oq" placeholder="${x.osr}" value="${esc(S.oq)}"></div><div class="chips">${[["all",x.allst],...Object.entries(x.st)].map(([k,v])=>`<button class="chip ${S.ost===k?"on":""}" data-ost="${k}">${v} (${k==="all"?S.orders.length:S.orders.filter(o=>o.status===k).length})</button>`).join("")}</div><div class="pad" style="padding-top:0">`+(fo.map(o=>`<div class="row" style="display:block;margin-top:8px"><b>${esc(o.name)}</b> · ${esc(o.phone)} <span class="tag">${x.st[o.status]||o.status}</span><div class="note">${esc(o.address)}</div><div class="note">${(o.items||[]).map(i=>esc(i.icon)+" "+esc(i.name)+" ×"+Number(i.qty)).join(", ")}</div><div class="pr">${tk(o.total)}</div>${payInfo(o)}<select data-os="${o.id}">${Object.entries(x.st).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")||`<p class="note">${x.none}</p>`)+`</div>`
 :S.atab==="prods"?`<div class="pad"><h2>${x.newp}</h2><input id="n1" placeholder="${x.pbn}"><input id="n2" placeholder="${x.pen}"><input id="n3" placeholder="${x.ppr}" inputmode="numeric"><input id="n4" value="🎁"><div class="note" style="margin-top:10px">📷 ছবি / Photo</div><input id="n6" type="file" accept="image/*"><select id="n5">${Object.entries(x.cats).filter(([k])=>k!=="all").map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="btn" id="sp">${x.save}</button><div style="margin-top:12px">${S.prods.map(p=>`<div class="row">${pic(p,42)}<div><div class="pn">${esc(p.name_bn)}</div><div class="pr">${tk(p.price)}</div></div><button class="chip" data-dp="${p.id}">${x.del}</button></div>`).join("")}</div></div>`
 :`<div class="pad"><h2>${x.addm}</h2><input id="m1" type="email" placeholder="${x.email}"><select id="m2"><option value="staff">Staff (orders)</option><option value="manager">Manager (orders + products)</option><option value="owner">Owner</option></select><button class="btn" id="am">${x.save}</button><div style="margin-top:12px">${S.staff.map(m=>`<div class="row"><div><b>${esc(m.email)}</b> <span class="tag">${esc(m.role)}</span></div><button class="chip" data-rm="${esc(m.email)}">${x.del}</button></div>`).join("")}</div></div>`);
 const oqi=$("#oq");if(oqi)oqi.oninput=e=>{S.oq=e.target.value;const p=e.target.selectionStart;render();const n=$("#oq");n.focus();n.setSelectionRange(p,p)};
}}

document.addEventListener("click",async e=>{const d=e.target.dataset,x=t(),id=e.target.id;
try{
if(d.cat){S.cat=d.cat;render()}
else if(d.clr){S.cat="all";S.q="";S.pmin="";S.pmax="";S.sort="def";render()}
else if(d.ost){S.ost=d.ost;render()}
else if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;head()}
else if(d.go){S.tab=d.go;render()}
else if(d.q){const v=(S.cart[d.q]||0)+Number(d.d);if(v<=0)delete S.cart[d.q];else S.cart[d.q]=v;render()}
else if(d.at){S.atab=d.at;if(d.at==="orders")await loadOrders();if(d.at==="team")await loadStaff();render()}
else if(id==="rf"){await loadOrders();render()}
else if(id==="lo"){await sb.auth.signOut();S.role=null;S.user=null;S.my=[];S.tab="home";render()}
else if(id==="li"||id==="su"){const em=$("#le").value.trim(),pw=$("#lp").value;
 const r=id==="li"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
 if(r.error)return fail(r.error);await loadRole();if(S.role){await loadOrders();await loadProds();S.tab="admin"}else{await loadMy();S.tab="my"}render()}
else if(id==="po"){const n=$("#fn").value.trim(),p=$("#fp").value.trim().replace(/[\s-]/g,""),ad=$("#fa").value.trim(),z=zone(),bk=$("#fb").value.trim(),tx=$("#ft").value.trim().toUpperCase();
 if(!n||!/^(?:\+?966|0)?5\d{8}$/.test(p)||!ad)return alert(x.fill);
 if(!/^01\d{9}$/.test(bk))return alert(x.badbk);
 if(!/^[A-Z0-9]{8,12}$/.test(tx))return alert(x.badtx);
 const its=S.prods.filter(q=>S.cart[q.id]);
 const tot=its.reduce((s,q)=>s+q.price*S.cart[q.id],0)+z.charge,adv=Math.ceil(tot/2);
 const{error}=await sb.from("orders").insert({name:n,phone:"+966"+p.replace(/^\+?966/,"").replace(/^0/,""),address:ad,total:tot,zone:z.k,delivery_charge:z.charge,advance:adv,due:tot-adv,bkash_number:bk,trx_id:tx,items:its.map(q=>({name:nm(q),icon:q.icon,qty:S.cart[q.id]}))});
 if(error)return error.code==="23505"?alert(x.dupt):fail(error);S.cart={};S.f={n:"",p:"",a:"",b:"",t:""};S.tab="home";render();alert(x.done)}
else if(id==="sp"){const bn=$("#n1").value.trim(),en=$("#n2").value.trim(),pr=parseInt($("#n3").value);if(!(bn||en)||!pr)return;
 const btn=e.target,f=$("#n6").files[0];btn.disabled=true;btn.textContent="...";
 try{let url=null;if(f){const blob=await shrink(f),path="p"+Date.now()+".jpg";
 const up=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
 url=sb.storage.from("products").getPublicUrl(path).data.publicUrl}
 const{error}=await sb.from("products").insert({name_bn:bn||en,name_en:en||bn,price:pr,icon:$("#n4").value||"🎁",cat:$("#n5").value,image_url:url});if(error)throw error;
 await loadProds();render()}catch(er){fail(er);btn.disabled=false;btn.textContent=t().save}}
else if(d.dp){const{error}=await sb.from("products").delete().eq("id",d.dp);if(error)return fail(error);await loadProds();render()}
else if(id==="am"){const{error}=await sb.rpc("add_staff",{p_email:$("#m1").value.trim(),p_role:$("#m2").value});if(error)return fail(error);await loadStaff();render()}
else if(d.rm){const{error}=await sb.rpc("remove_staff",{p_email:d.rm});if(error)return fail(error);await loadStaff();render()}
}catch(err){fail(err)}});
document.addEventListener("input",e=>{const m={fn:"n",fp:"p",fa:"a",fb:"b",ft:"t"}[e.target.id];if(m)S.f[m]=e.target.value});
document.addEventListener("change",async e=>{if(e.target.id==="fz"){S.zone=e.target.value;render();return}if(e.target.dataset.os){const{error}=await sb.from("orders").update({status:e.target.value}).eq("id",e.target.dataset.os);if(error)fail(error)}});
$("#lb").onclick=()=>{S.lang=S.lang==="bn"?"en":"bn";render()};
$("#cb").onclick=()=>{S.tab="cart";render()};
$("#ab").onclick=async()=>{if(S.role){await loadOrders();S.tab="admin"}else if(S.user){await loadMy();S.tab="my"}else S.tab="login";render()};
(async()=>{render();await loadProds();await loadRole();if(S.role)await loadOrders();else if(S.user)await loadMy();render();setInterval(async()=>{if(S.tab==="admin"&&S.atab==="orders"&&document.activeElement.id!=="oq"){await loadOrders();render()}},30000)})();
</script>
</body>
</html>
